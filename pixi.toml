[project]
name = "circuit-training"
version = "0.1.0"
description = "Circuit Training: Reinforcement Learning for Chip Placement"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"

# System dependencies for DREAMPlace
cairo = ">=1.16"
boost = ">=1.74"
flex = ">=2.6"

# PyTorch from conda (more reliable than pip)
pytorch-cpu = ">=2.0"

[pypi-dependencies]
# Core ML dependencies
tensorflow = ">=2.16.0"
tf-keras = ">=2.16.0"
dm-reverb = ">=0.14.0"

# Core utilities
numpy = ">=1.26.0,<2.0.0"
gin-config = ">=0.5.0"
sortedcontainers = ">=2.4.0"
absl-py = ">=2.0.0"
timeout-decorator = ">=0.5.0"

# DREAMPlace dependencies
shapely = ">=1.7.0"
scipy = ">=1.1.0"
matplotlib = ">=2.2.2"
cairocffi = ">=0.9.0"

# Install the package itself in editable mode
circuit-training = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-xdist = ">=3.0"
pytest-timeout = ">=2.0"
ruff = ">=0.1.0"
pre-commit = ">=3.0"
pyyaml = ">=6.0"

[feature.docs.dependencies]
mkdocs-material = ">=9.0"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tasks]
test = "pytest circuit_training/ -v"
test-cov = "pytest circuit_training/ --cov=circuit_training --cov-report=term-missing"
lint = "ruff check circuit_training/"
format = "ruff format circuit_training/"
