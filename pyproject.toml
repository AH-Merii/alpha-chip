[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "circuit-training"
dynamic = ["version"]
description = "Circuit Training: Reinforcement Learning for Chip Placement"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Google Research", email = "circuit-training@google.com" }
]
keywords = [
    "reinforcement-learning",
    "chip-design",
    "placement",
    "deep-learning",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "tensorflow>=2.15.0,<2.16.0",
    "tf-keras>=2.15.0,<2.16.0",
    "tensorflow-probability>=0.23.0,<0.24.0",
    "gin-config>=0.5.0",
    "sortedcontainers>=2.4.0",
    "absl-py>=2.0.0",
    "dm-reverb>=0.14.0",
    "tf-agents>=0.19.0",
    "timeout-decorator>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
    "pre-commit",
    "pyyaml",
]
dreamplace = [
    "torch",
    "shapely",
    "scipy",
    "matplotlib",
    "cairocffi",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
]
all = [
    "circuit-training[dev,dreamplace,docs]",
]

# === UV DEPENDENCY GROUPS (PEP 735) ===

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "pyyaml>=6.0",
]
lint = [
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
]

[project.scripts]
ct-train = "circuit_training.learning.train_ppo:main"
ct-collect = "circuit_training.learning.ppo_collect:main"
ct-eval = "circuit_training.learning.eval:main"
ct-server = "circuit_training.learning.ppo_reverb_server:main"

[project.urls]
Homepage = "https://github.com/google-research/circuit_training"
Documentation = "https://github.com/google-research/circuit_training#readme"
Repository = "https://github.com/google-research/circuit_training"
Issues = "https://github.com/google-research/circuit_training/issues"

[tool.hatch.version]
path = "circuit_training/version.py"

[tool.hatch.build.targets.wheel]
packages = ["circuit_training"]

[tool.hatch.build.targets.sdist]
include = [
    "/circuit_training",
    "/tests",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git",
]

# === RUFF CONFIGURATION ===

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
src = ["circuit_training", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (legacy code uses single-letter vars)
    "B905",   # zip strict parameter (legacy code)
    "UP015",  # redundant open mode (legacy code)
    "UP007",  # Use X | Y for type annotations (legacy code)
    "UP031",  # Use format specifiers (legacy code)
    "RUF005", # Consider iterable unpacking (legacy code)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Unused function argument (fixtures)
    "S101",    # Use of assert
]
"**/*_test.py" = [
    "ARG001",
    "S101",
]
"circuit_training/dreamplace/**/*.py" = [
    "E741",   # ambiguous variable name
    "B905",   # zip strict
]

[tool.ruff.lint.isort]
known-first-party = ["circuit_training"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80

# === PYREFLY CONFIGURATION ===

[tool.pyrefly]
python_version = "3.11"
project_includes = ["circuit_training"]
strict = false  # Start lenient, tighten over time

# === PYTEST CONFIGURATION ===

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "circuit_training"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--continue-on-collection-errors",
    "--ignore=circuit_training/dreamplace/",
    "--ignore=circuit_training/utils/test_utils.py",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]
timeout = 60

[tool.coverage.run]
source = ["circuit_training"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 60
show_missing = true
