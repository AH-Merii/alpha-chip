site_name: Circuit Training
site_description: Reinforcement Learning for Chip Placement
site_url: https://google-research.github.io/circuit_training
repo_url: https://github.com/google-research/circuit_training
repo_name: google-research/circuit_training

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Environment: guide/environment.md
      - Training: guide/training.md
      - Evaluation: guide/evaluation.md
      - Distributed Training: guide/distributed.md
  - API Reference:
      - Environment: api/environment.md
      - Model: api/model.md
      - Learning: api/learning.md
      - Config: api/config.md
  - Examples:
      - Ariane RISC-V: examples/ariane.md
      - MEP Room: examples/mep.md
  - Contributing: contributing.md
